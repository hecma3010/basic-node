<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>JSON Quiz - All at once</title>
        <script src="ajax-all.js" defer></script>
    </head>
    <body>
        <main>
            <h1>Quick Math Quiz</h1>
            <form id="quiz-form">
                <fieldset>
                    <legend>What is 2 + 2?</legend>
                    <input type="radio" name="q1" id="q1-1" value="1">
                    <label for="q1-1">3</label>
                    <input type="radio" name="q1" id="q1-2" value="2">
                    <label for="q1-2">4</label>
                    <input type="radio" name="q1" id="q1-3" value="3">
                    <label for="q1-3">5</label>
                    <output id="q1Result"></output>
                </fieldset>
                <fieldset>
                    <legend>What is 3 x 3?</legend>
                    <input type="radio" name="q2" id="q2-1" value="1">
                    <label for="q2-1">6</label>
                    <input type="radio" name="q2" id="q2-2" value="2">
                    <label for="q2-2">8</label>
                    <input type="radio" name="q2" id="q2-3" value="3">
                    <label for="q2-3">9</label>
                    <output id="q2Result"></output>
                </fieldset>
                <fieldset>
                    <legend>What is 10 - 7?</legend>
                    <input type="radio" name="q3" id="q3-1" value="1">
                    <label for="q3-1">3</label>
                    <input type="radio" name="q3" id="q3-2" value="2">
                    <label for="q3-2">4</label>
                    <input type="radio" name="q3" id="q3-3" value="3">
                    <label for="q3-3">7</label>
                    <output id="q3Result"></output>
                </fieldset>
                <button type="submit">Check Answers</button>
            </form>
        </main>
    </body>
</html>
